{% extends "base.html" %}
{% block title %}Delete Visit - Clinic EMR{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-lg shadow-sm border p-6 text-center">
        <i data-lucide="triangle-alert" class="w-12 h-12 text-red-500 mx-auto mb-4"></i>
        <h1 class="text-xl font-bold text-gray-800 mb-2">Delete Visit</h1>
        <p class="text-gray-600 mb-6">Are you sure you want to delete Visit #{{ visit.id }} for <strong>{{ visit.patient.full_name }}</strong>? This will also delete the associated prescription.</p>
        <form method="post">
            {% csrf_token %}
            <div class="flex gap-3 justify-center">
                <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded text-sm transition hover:bg-red-700 inline-flex items-center gap-1.5"><i data-lucide="trash-2" class="w-4 h-4"></i> Delete</button>
                <a href="{% url 'visit_detail' visit.pk %}" class="bg-gray-200 text-gray-700 px-6 py-2 rounded text-sm transition hover:bg-gray-300 inline-flex items-center gap-1.5"><i data-lucide="x" class="w-4 h-4"></i> Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
