{% extends "base.html" %}
{% block title %}Login - Clinic EMR{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center -mt-14">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-blue-800 mb-6">Clinic EMR</h1>
        <h2 class="text-lg text-center text-gray-600 mb-6">Login</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-medium mb-2">Username</label>
                {{ form.username }}
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-medium mb-2">Password</label>
                {{ form.password }}
            </div>
            {% if form.errors %}
            <div class="mb-4 text-red-600 text-sm">Invalid username or password.</div>
            {% endif %}
            <button type="submit" class="w-full bg-blue-800 text-white py-2 rounded hover:bg-blue-700 font-medium">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
