{% extends "base.html" %}
{% block title %}Setup - Clinic EMR{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center -mt-14">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-blue-800 mb-2">Clinic EMR</h1>
        <h2 class="text-lg text-center text-gray-600 mb-6">Create Admin Account</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-medium mb-2">Username</label>
                <input type="text" name="username" required
                       class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-medium mb-2">Password</label>
                <input type="password" name="password" required
                       class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-medium mb-2">Confirm Password</label>
                <input type="password" name="confirm" required
                       class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>
            {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                <div class="text-sm {% if message.tags == 'error' %}text-red-600{% else %}text-green-600{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            <button type="submit" class="w-full bg-blue-800 text-white py-2 rounded hover:bg-blue-700 font-medium">
                Create Admin
            </button>
        </form>
    </div>
</div>
{% endblock %}
