{% extends "base.html" %}
{% block title %}Delete Invoice - Clinic EMR{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-lg shadow-sm border p-6 text-center">
        <h1 class="text-xl font-bold text-gray-800 mb-2">Delete Invoice</h1>
        <p class="text-gray-600 mb-6">Are you sure you want to delete <strong>{{ invoice.invoice_id }}</strong> for <strong>{{ invoice.patient.full_name }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <div class="flex gap-3 justify-center">
                <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded text-sm hover:bg-red-700">Delete</button>
                <a href="{% url 'invoice_detail' invoice.pk %}" class="bg-gray-200 text-gray-700 px-6 py-2 rounded text-sm hover:bg-gray-300">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
