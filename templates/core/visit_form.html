{% extends "base.html" %}
{% block title %}{{ title }} - Clinic EMR{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">{{ title }}: {{ patient.full_name }}</h1>
    <div class="bg-white rounded-lg shadow-sm border p-6">
        <form method="post">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">Symptoms</label>
                    {{ form.symptoms }}
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">Diagnosis</label>
                    {{ form.diagnosis }}
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">Notes</label>
                    {{ form.notes }}
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">Follow-up Date</label>
                    {{ form.follow_up_date }}
                </div>
            </div>
            <div class="mt-6 flex gap-3">
                <button type="submit" class="bg-blue-800 text-white px-6 py-2 rounded text-sm hover:bg-blue-700">
                    {% if visit %}Save Changes{% else %}Save & Continue to Prescription{% endif %}
                </button>
                <a href="{% if patient %}{% url 'patient_detail' patient.pk %}{% else %}{% url 'dashboard' %}{% endif %}" class="bg-gray-200 text-gray-700 px-6 py-2 rounded text-sm hover:bg-gray-300">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
